<style>
:root{
  --bg:#1E2433;--surface:#283047;--soft:#222A3F;--line:#38425C;--ink:#E8ECF4;--muted:#98A4BD;--sline:#8E9BA8;
  --navy:#1E90FF;--navy-ink:#FFFFFF;--sheet:#1F3864;--sheet-ink:#9DB8E0;--pink:#F0626F;
  --ok:#3DD6A0;--ok-bg:rgba(61,214,160,.16);--wait:#F2B84B;--wait-bg:rgba(242,184,75,.16);--bad:#F0626F;--bad-bg:rgba(240,98,111,.17);--info:#5AA9FF;--info-bg:rgba(90,169,255,.17);--mute:#A4B0BC;--mute-bg:rgba(164,176,188,.16);
  --side:#2A3248;--side-ink:#C5CEE0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#EEF1F6;--surface:#FFFFFF;--soft:#F4F6FA;--line:#D9E0EA;--ink:#17212B;--muted:#5B6875;--sline:#8E9BA8;
  --navy:#1E7FE8;--navy-ink:#FFFFFF;--sheet-ink:#1F3864;--pink:#E5526B;
  --ok:#1F7A5C;--ok-bg:#DDF1E9;--wait:#9A6414;--wait-bg:#FBEBCB;--bad:#A8362B;--bad-bg:#F8DDD9;--info:#2F5F94;--info-bg:#DCE9F7;--mute:#566270;--mute-bg:#E6EAEE;
  --side:#FFFFFF;--side-ink:#3A475A;
}
/* the Transmitted to Accounting sheet always keeps its Excel look, in either theme */
.sheetwrap{--surface:#FFFFFF;--ink:#17212B;--soft:#F5F7F9;--line:#D5DCE3;--sline:#8E9BA8;--muted:#5B6875;--info:#2F5F94;--info-bg:#DCE9F7;--ok:#1F7A5C;--ok-bg:#DDF1E9;--bad:#A8362B;--bad-bg:#F8DDD9;--wait:#9A6414;--wait-bg:#FBEBCB;--mute:#566270;--mute-bg:#E6EAEE;background:#FFFFFF;color:#17212B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Source Sans 3",system-ui,sans-serif;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:252px;flex:none;background:var(--side);color:var(--side-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 8px 6px}
.brandimg{width:116px;height:116px;border-radius:50%;display:block;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.logo svg{width:36px;height:36px;flex:none}
.logo b{display:block;font-size:17px;line-height:1.15;color:var(--ink)}
.profile{text-align:center;padding:6px 8px 14px}
.avatar{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1E90FF,#7A5CFA);border:3px solid var(--bg)}
.profile b{display:block;font-size:16px;color:var(--ink)}
.profile span{font-size:13px;color:var(--muted)}
.navh{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;border-top:1px dashed var(--line);margin-top:10px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;padding:5px 8px;border-radius:26px;border:0;background:none;color:var(--side-ink);cursor:pointer;width:100%;text-align:left}
.nav .ic{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex:none;opacity:.85}
.nav .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .t{flex:1;font-size:15px}
.nav:hover{background:rgba(127,140,170,.13)}
.nav.on{color:var(--ink);font-weight:600}
.nav.on .ic{background:var(--ink);color:var(--side);border-color:var(--ink);opacity:1}
.nav i{font-style:normal;font-size:12px;background:var(--pink);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.nav i.w{background:#C98A2B}
.navfoot{margin-top:auto;padding-top:10px}
.main{flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.topbar h1{font-size:26px;letter-spacing:-.2px}
.searchpill{flex:1 1 230px;min-width:200px;max-width:480px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:26px;padding:0 14px;height:44px;margin-left:10px}
.searchpill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.searchpill input{border:0;background:transparent;height:100%;padding:0;flex:1;outline:none;min-width:0}
.searchpill:focus-within{outline:2px solid var(--navy);outline-offset:2px}
.tbspace{flex:1}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:rgba(127,140,170,.16)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .pip{position:absolute;top:7px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--pink)}
.subtle{color:var(--muted);margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:16px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.filters .q{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bchips{align-items:center}.bclab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-right:2px}.chip i{font-style:normal;opacity:.65;margin-left:3px;font-size:12px}.chip.on i{opacity:.9}.bckey{font-size:11px;opacity:.55;margin:0 4px}.rmb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.rmb+.rmb{margin-top:6px}td.bad{color:#C2410C;font-weight:700}
kbd{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;font:600 12px ui-monospace,Consolas,monospace;background:var(--surface)}.kbt td{padding:6px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:3px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid transparent;border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;cursor:pointer}
.card b{display:block;font-size:24px;font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.15}
.card span{font-size:13px;color:var(--muted)}
.card.ok{border-left-color:var(--ok)}.card.wait{border-left-color:var(--wait)}.card.bad{border-left-color:var(--bad)}.card.info{border-left-color:var(--info)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:var(--soft);font-size:12.5px;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
tr.go{cursor:pointer}
/* sheet look, matches the Transmitted to Accounting Excel file */
.sheettitle{text-align:center;font:700 17px Arial,Helvetica,sans-serif;color:var(--sheet-ink);padding:4px 0 8px;letter-spacing:.3px}
table.sheet{min-width:1180px;border:1px solid var(--sline)}
table.sheet th{background:#1F3864;color:#fff;text-align:center;border:1px solid #0E1D3A;font:700 12.5px Arial,Helvetica,sans-serif;padding:8px 6px;cursor:pointer;white-space:normal;user-select:none;vertical-align:middle}
table.sheet td{border:1px solid var(--sline);text-align:center;font:13px Arial,Helvetica,sans-serif;padding:6px 6px;vertical-align:middle}
table.sheet td.rm{min-width:210px}
table.sheet td.nw{white-space:nowrap}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:16px}
.evcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.evcard .th{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;font-size:42px;cursor:pointer}
.evcard .th img{width:100%;height:100%;object-fit:cover}
.evcard b{word-break:break-all}

function parseUS(v){
  if(v==null||String(v).trim()==='')return{v:'',bad:false};
  if(typeof v==='number'&&!(v>20000&&v<80000))return{v:'',bad:true};

/* writes go through a queue and are sent in batches, so big imports stay fast */
const QUEUE=[];let flushing=false,flushTimer=null;
function setSync(state){const el=document.getElementById('syncpill');if(!el)return;
  if(!UID){el.hidden=true;return}
  el.hidden=false;el.className='sync'+(state==='error'?' err':'');
  el.textContent=state==='saving'?'Saving…':state==='error'?'Not saved. Check your connection.':'All changes saved';
  if(state==='saved'){clearTimeout(setSync.t);setSync.t=setTimeout(()=>{if(!QUEUE.length&&!flushing)el.hidden=true},2500)}}
function enq(op){QUEUE.push(op);setSync('saving');if(!flushTimer&&!flushing)flushTimer=setTimeout(flush,40);return Promise.resolve()}
async function runGroup(k,t,grp){
  const last=(key)=>{const m=new Map();grp.forEach(g=>m.set(g.row[key],g.row));return[...m.values()]};
  let r;
  if(t==='docs'&&k==='put')r=await sb.from('ap_docs').upsert(last('id'),{onConflict:'id'});
  else if(t==='docs'&&k==='del')r=await sb.from('ap_docs').delete().in('id',grp.map(g=>g.id));
  else if(t==='files'&&k==='put')r=await sb.from('ap_files').upsert(last('id'),{onConflict:'id'});
  else if(t==='files'&&k==='del')r=await sb.from('ap_files').delete().in('id',grp.map(g=>g.id));
  else if(t==='audit'&&k==='put')r=await sb.from('ap_audit').upsert(last('id'),{onConflict:'id'});
  else if(t==='meta'&&k==='put')r=await sb.from('ap_settings').upsert(grp[grp.length-1].row,{onConflict:'user_id'});
  if(r&&r.error)throw r.error;
}
async function flush(){
  flushTimer=null;if(flushing)return;flushing=true;let failed=false;
  while(QUEUE.length){
    const first=QUEUE[0],grp=[];
    while(QUEUE.length&&QUEUE[0].k===first.k&&QUEUE[0].t===first.t&&grp.length<200)grp.push(QUEUE.shift());
    try{await runGroup(first.k,first.t,grp)}catch(e){failed=true;console.error(e);toast('Could not save to the server: '+((e&&e.message)||e))}
  }
  flushing=false;setSync(failed?'error':'saved');
}
async function flushNow(){
  if(flushTimer){clearTimeout(flushTimer);flushTimer=null}
  if(!flushing&&QUEUE.length)await flush();
  while(flushing||QUEUE.length)await new Promise(r=>setTimeout(r,40));
}

function recompute(){
  const live=S.docs.filter(d=>d.status!=='Cancelled / Returned');
  const dup={},sup={};
  live.forEach(d=>{const k=siKey(d);if(k)dup[k]=(dup[k]||0)+1;const p=norm(d.poNo);if(p&&d.supplier)(sup[p]=sup[p]||new Set()).add(supKey(d.supplier))});

    d._days=d.dateTx?(d.dateRx?bd(d.dateTx,d.dateRx):(d._pending?bd(d.dateTx,today):null)):null;

    d._bucket=d._pending?bucketOf(d._days):null;
    const f=[];
    if(isRx(d)){
      if(!d.dateRx)f.push('Missing receipt date');
      if(!d.rxBy)f.push('Missing receiver name');
      if(!d.fileIds.length&&!d.confirmed)f.push('No receiving evidence');

async function sha(buf){
  try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  /* fallback when the browser blocks crypto.subtle (some embedded frames) */
  const u=new Uint8Array(buf);let h1=0xdeadbeef^u.length,h2=0x41c6ce57^u.length;
  for(let i=0;i<u.length;i++){const c=u[i];h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16)+'-'+u.length;
}
async function storeFiles(list){
  const ids=[],fresh=[],skipped=[];
  for(const f of list){const buf=await f.arrayBuffer();const h=await sha(buf);
    const ex=S.files.find(x=>x.hash===h);
    if(ex){skipped.push(f.name);if(!ids.includes(ex.id))ids.push(ex.id);continue}
    const id=uid();const ent={id,name:f.name,type:f.type||'application/octet-stream',size:f.size,hash:h,blob:new Blob([buf],{type:f.type}),addedAt:nowIso(),recordId:''};
    await uploadNow(ent);S.files.push(ent);ids.push(id);fresh.push(id)}
  return{ids,fresh,skipped};
}

function parsePaste(text){

    let off=(/^\d+$/.test(c[0].trim())&&c.length>=11)?1:0;

    if(!row.supplier&&!row.poNo&&!row.siNo)return;

/* ---------- bulk: add evidence / confirm receipt for selected rows ---------- */
let BRX=null,BST=null;
async function submitBulkRx(){
  const rows=S.docs.filter(d=>BRX.ids.includes(d.id));
  const name=$('#brx_n').value.trim(),date=$('#brx_d').value,files=[...$('#brx_f').files],conf=$('#brx_c').checked;
  const errs=[],mark=!!(name&&date);
  if(!!name!==!!date)errs.push('Enter both the AP receiver name and the date received, or leave both blank to only attach evidence.');
  if(!name&&!date&&!files.length)errs.push('Attach a file, or enter the receiver name and date and tick the confirmation box.');
  if(mark&&!files.length&&!conf&&!rows.every(d=>d.fileIds.length))errs.push('To mark rows received, attach evidence or tick the confirmation box. A typed name alone does not confirm receipt.');
  if(mark){const early=rows.filter(d=>d.dateTx&&date<d.dateTx);if(early.length)errs.push(`The date received is earlier than the date transmitted for ${early.length} row(s).`)}
  if(errs.length){$('#brxerr').innerHTML=`<div class="err">${errs.map(esc).join('<br>')}</div>`;return}
  snap((mark?'Confirm receipt, ':'Add evidence, ')+rows.length+' rows');
  const st=await storeFiles(files);
  for(const d of rows){
    const ch=[];
    st.ids.forEach(id=>{if(!d.fileIds.includes(id))d.fileIds.push(id)});
    if(st.ids.length)ch.push(st.ids.length+' file(s) attached');
    if(mark){ch.push(`Status ${d.status} → Received by AP, received by ${name} on ${date}`);d.status='Received by AP';d.rxBy=name;d.dateRx=date;d.enteredRxAt=nowIso();
      if(conf)d.confirmed=true;
      d.remarks=(d.remarks||'').replace(/(\s*\|\s*)?Sheet says:[^|]*/,'').trim()}
    d.updatedAt=nowIso();await saveDoc(d);logA(mark?'Receipt confirmed (bulk)':'Evidence added (bulk)',d,ch.join('; '));
  }
  st.fresh.forEach(id=>{const f=S.files.find(x=>x.id===id);f.recordId=rows[0].id;dbPut('files',f)});
  S.sel.clear();S.selMode=false;closeModal();render();
  toast((mark?rows.length+' row(s) marked Received by AP.':'Evidence added to '+rows.length+' row(s).'),'Undo',undo);
}

const FIELDS=['sbu','delivDate','dateRecv','supplier','poNo','siNo','siDate','drNo','rr','amount','terms','dateTx','txBy','batch','buyer','payStatus','status','dateRx','rxBy','rxRef','condition','fuOwner','fuTarget','fuStatus','remarks'];

document.addEventListener('keydown',e=>{
  const t=e.target;if(!TXM_OPEN()||!t||!t.dataset||t.dataset.tx==null||t.dataset.tx==='')return;
  const key=e.key;if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(key))return;

  const r=+t.dataset.tx,c=+t.dataset.c,len=t.value.length;let nr=r,nc=c;
  if(key==='ArrowUp'||(key==='Enter'&&e.shiftKey))nr=r-1;

  else if(key==='ArrowRight'){if(!(t.selectionEnd===len&&(t.selectionStart===len||t.selectionStart===0)))return;nc=c+1}

});

document.addEventListener('paste',e=>{
  const t=e.target;
  if(t&&t.id==='tx_paste'){setTimeout(()=>A.txparse(),30);return}
  if(!TXM_OPEN())return;
  const inGrid=!!(t&&t.dataset&&t.dataset.tx!=null&&t.dataset.tx!=='');
  if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&!inGrid)return;               /* header fields paste normally */
  const text=((e.clipboardData||window.clipboardData).getData('text')||'');
  const grid=parseGrid(text),multi=grid.length>1||(grid[0]&&grid[0].length>1),cells=txSelCells();
  let r0,c0;
  if(cells.length){r0=Math.min(...cells.map(x=>x[0]));c0=Math.min(...cells.map(x=>x[1]))}
  else if(inGrid){r0=+t.dataset.tx;c0=+t.dataset.c}
  else return;
  if(!multi){
    if(cells.length>1||(cells.length===1&&!inGrid)){e.preventDefault();txFill(grid[0]?grid[0][0]:'');toast('Filled '+cells.length+' highlighted cell(s).')}
    return;                                                                    /* one value into one cell: normal paste */
  }
  e.preventDefault();
  if((grid[0]||[]).length>=8){                                                 /* whole rows copied from the sheet (No. to Status) */
    const p=parsePaste(text);if(!p.rows.length){toast('No rows recognised in the pasted text.');return}
    placeRows(p.rows,r0);applyPasteMeta(p.meta);toast(p.rows.length+' row(s) pasted. Check them, then save.');return}
  txBlockPaste(grid,r0,c0);
  toast(grid.length+' row(s) × '+Math.max(...grid.map(x=>x.length))+' column(s) pasted at the highlighted cell.');
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.impf!=null){IMP.buyerOk=false;IMP.filter=t.value;$('#impbox').innerHTML=impReview();return}
  if(t.dataset&&t.dataset.impd){IMP.buyerOk=false;const k=t.dataset.impd;if(k==='group'||k==='sbuPrefix')IMP.opts[k]=t.checked;else IMP.def[k]=t.value;if(IMP.rows)impParse();$('#impbox').innerHTML=impReview();return}
  if(t.id&&/^tx_(d|by|b|rb|rd|ps|rm|buyer)$/.test(t.id))txDraftSave();
  if(t.id==='tx_buyer'&&TXM)TXM.buyerOk=false;
  if(t.dataset&&t.dataset.fm){fmUpdate(t);return}
  if(t.dataset&&t.dataset.bl){BL[t.dataset.bl]=t.value;runBuyerLog();return}
  if(t.dataset.f&&t.dataset.f!=='q'){F[t.dataset.f]=t.value;render()}
  else if(t.dataset.r){RF[t.dataset.r]=t.type==='checkbox'?t.checked:t.value;runReportPreview()}
  else if(t.dataset.m){IMP.map[t.dataset.m]=t.value===''?null:+t.value}

  else if(t.dataset.ri!=null&&t.dataset.ri!==''){IMP.rows[+t.dataset.ri].use=t.checked;$('#impbox').innerHTML=impReview()}
  else if(t.id==='xin'&&t.files[0]){readSheet(t.files[0]).then(()=>{$('#impbox').innerHTML=impReview()}).catch(()=>toast('Could not read that spreadsheet.'))}
  else if(t.id==='sin'){[...t.files].forEach(f=>S.scans.push({file:f}));renderOut()}
  else if(t.id==='rin'&&t.files[0]){t.files[0].text().then(async txt=>{try{const j=JSON.parse(txt);let n=0;snap('Restore backup');
      const idMap={};
      for(const d of j.docs||[]){if(S.docs.some(x=>x.tid===d.tid))continue;const nid=isUUID(d.id)?d.id:uid();idMap[d.id]=nid;d.id=nid;d.fileIds=[];S.docs.push(d);await saveDoc(d);n++}
      for(const a of j.audit||[]){const rid=idMap[a.recordId]||(isUUID(a.recordId)?a.recordId:'');if(a.recordId&&!rid)continue;a.recordId=rid;a.id=isUUID(a.id)&&!S.audit.some(x=>x.id===a.id)?a.id:uid();S.audit.push(a);await dbPut('audit',a)}
      S.cfg.counter=Math.max(S.cfg.counter,(j.cfg&&j.cfg.counter)||0);await saveCfg();toast(n+' record(s) restored.');render()}catch(err){toast('That file is not a valid backup.')}})}
});
/* ---------- keyboard shortcuts (single keys work when you are not typing in a field) ---------- */
const KEYS=[['/','Search PO#, SI#, supplier'],['N','New transmittal'],['S','Select rows on / off'],['D','Dashboard'],['R','Master Register'],['T','Transmittal Form'],['B','Buyer Log'],['L','AP Receiving Log'],['P','Pending & Overdue'],['V','Verification & Discrepancies'],['E','Reports & Exports'],['I','Import / Upload'],['A','Audit Trail'],['Alt+1…6','Show one buyer (Arlene, Ellaris, Carla, Sherwin, Frayla, Vanesa)'],['Alt+0','All buyers'],['Ctrl+A','Select all shown rows (while selecting)'],['Ctrl+Z','Undo'],['Esc','Close a window / clear selection'],['?','This list']];
const KEYV={d:'dashboard',r:'register',t:'form',b:'buyers',l:'log',p:'pending',v:'verify',e:'reports',i:'import',a:'audit'};
const showKeys=()=>modal(`<h2>Keyboard shortcuts</h2><p class="muted">Single-letter keys work whenever you are not typing in a field.</p><table class="sheet kbt"><tbody>${KEYS.map(([k,l])=>`<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(l)}</td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn pri" data-a="close">Close</button></div>`);
const goView=v=>{S.view=v;S.selMode=false;S.sel.clear();SHS.rows.clear();SHS.cols.clear();render()};
const selToggle=()=>{if(!['register','log','pending','verify'].includes(S.view)){S.view='register';S.selMode=true;S.sel.clear();render()}else{S.selMode=!S.selMode;S.sel.clear();render()}toast(S.selMode?'Select rows: click or drag rows, Shift+click for a range, Ctrl+A for all. Press S again to finish.':'Selection closed.')};
document.addEventListener('keydown',e=>{
  if(!UID||e.ctrlKey||e.metaKey||e.altKey||TXM_OPEN())return;const t=e.target;if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key;if($('#layer').innerHTML){return}
  if(k==='/'){const g=$('#gsearch');if(g){e.preventDefault();g.focus();g.select()}return}
  if(k==='?'){e.preventDefault();showKeys();return}
  const lk=k.length===1?k.toLowerCase():'';if(!lk)return;
  if(lk==='n'){e.preventDefault();A.newtx();return}

});
document.addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&/^Digit\d$/.test(e.code||'')&&UID&&!$('#layer').innerHTML&&!TXM_OPEN()){
    e.preventDefault();const i=+e.code.slice(5),bn=buyerNames();if(i>0&&!bn[i-1])return;
    F.buyer=i===0?'':bn[i-1];F.preset='';if(!FILTERED_VIEWS.includes(S.view))S.view='register';S.selMode=false;S.sel.clear();render();
    toast(i===0?'Showing all buyers':'Showing '+buyerLabel(bn[i-1]));return}

  if(e.key==='Enter'&&e.target&&e.target.id==='gsearch'){e.preventDefault();F.q=e.target.value;S.view='register';S.selMode=false;S.sel.clear();render();return}

  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;if($('#layer').innerHTML)return;e.preventDefault();undo();return}
  if(e.key==='Delete'&&TXM_OPEN()&&txSelActive()){const t=e.target;if(!(t&&t.tagName==='INPUT'&&t.selectionStart!==t.selectionEnd)){e.preventDefault();txClearSel();return}}
  if(e.key==='Escape'&&TXM_OPEN()&&txSelActive()){txSelClear();return}

/* ---------- sign in + boot (Supabase) ---------- */
function showAuth(msg,fatal){
  $('#auth').innerHTML=`<div class="authwrap"><form class="authcard" id="af" autocomplete="on"><div class="logo" style="padding:0 0 12px"><img class="brandimg" src="${LOGO}" alt="AP Transmittal Tracker" style="width:132px;height:132px"></div>
   <h2 style="font-size:20px;margin-bottom:4px">Sign in</h2><p class="muted" style="margin:0 0 14px">Your tracker is private. Use the account created in Supabase.</p>
   <div id="aerr" class="${msg?(fatal?'err':'warn'):''}">${esc(msg||'')}</div>
   ${fatal?'':`<label class="f">Email<input type="email" name="email" required autocomplete="username"></label><label class="f" style="margin-top:10px">Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn pri" type="submit" style="width:100%;margin-top:16px">Sign in</button>`}</form></div>`;
  $('#main').innerHTML='';$('#side').innerHTML='';setSync();
}
async function signIn(form){
  const fdm=new FormData(form),btn=form.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';
  const{data,error}=await sb.auth.signInWithPassword({email:String(fdm.get('email')).trim(),password:String(fdm.get('password'))});
  if(error){btn.disabled=false;btn.textContent='Sign in';const e=$('#aerr');e.className='err';e.textContent=/invalid/i.test(error.message)?'Email or password is not correct.':error.message;return}
  await startSession(data.session);
}
async function loadAll(){
  const[docs,files,audit,st]=await Promise.all([fetchAll('ap_docs','created_at',true),fetchAll('ap_files','added_at',true),fetchAll('ap_audit','ts',false,3000),sb.from('ap_settings').select('*').maybeSingle()]);
  if(st.error)throw st.error;
  S.docs=docs.map(fromRow);S.files=files.map(fFromRow);
  S.audit=audit.map(a=>({id:a.id,ts:a.ts,action:a.action,recordId:a.record_id||'',tid:a.tid||'',detail:a.detail||''}));
  const c=st.data;if(c)S.cfg=Object.assign(S.cfg,{overdueDays:c.overdue_days,buckets:c.buckets||[3,7,14],counter:c.counter||0,theme:c.theme||'dark',profile:c.profile||{},views:c.views||[],buyerRules:c.buyer_rules||{}});
  S.cfg.counter=Math.max(S.cfg.counter||0,...S.docs.map(d=>parseInt(String(d.tid).replace(/\D/g,''),10)||0));
  LASTLOAD=Date.now();
}
async function startSession(session){
  UID=session.user.id;EMAIL=session.user.email||'';$('#auth').innerHTML='';
  try{await loadAll()}catch(e){UID=null;showAuth('Could not load your data: '+((e&&e.message)||e)+'. Reload the page to try again.',true);return}
  applyTheme();render();rmCheck();siFill();
}
document.addEventListener('submit',e=>{if(e.target.id==='af'){e.preventDefault();signIn(e.target).catch(err=>{const el=$('#aerr');if(el){el.className='err';el.textContent=(err&&err.message)||String(err)}})}});
window.addEventListener('beforeunload',e=>{if(QUEUE.length||flushing){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!UID||QUEUE.length||flushing||S.selMode||$('#layer').innerHTML||Date.now()-LASTLOAD<45000)return;
  try{await loadAll();render()}catch(e){}
  rmCheck();siFill()});
(async function(){
  if(typeof supabase==='undefined'||!supabase.createClient){showAuth('The Supabase library could not load. Check your connection and reload the page.',true);return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){UID=null;EMAIL='';S.docs=[];S.files=[];S.audit=[];showAuth()}});
  let sess=null;try{const r=await sb.auth.getSession();sess=r.data&&r.data.session}catch(e){}
  if(sess)await startSession(sess);else showAuth();
})();
